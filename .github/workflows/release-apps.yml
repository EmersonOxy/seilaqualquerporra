name: Publicar jogo e editor separadamente

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar Velopack CLI
        run: dotnet tool install vpk --version 1.2.161 --tool-path ./.tools

      - name: Publicar jogo
        run: dotnet publish src-recuperado/ControladorFPS.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/game --nologo

      - name: Publicar editor
        run: dotnet publish tools/MapEditor/MapEditor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/editor --nologo

      - name: Criar pacote de atualização do jogo
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./.tools/vpk.exe pack --packId ControladorFPS --packVersion $version --packTitle "Controlador FPS" --packDir dist/game --mainExe ControladorFPS.exe --channel win --runtime win-x64 --outputDir dist/game-release

      - name: Criar pacote de atualização do editor
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./.tools/vpk.exe pack --packId MapEditor --packVersion $version --packTitle "Editor de Mapas - Controlador FPS" --packDir dist/editor --mainExe MapEditor.exe --channel editor --runtime win-x64 --outputDir dist/editor-release

      - name: Publicar canal independente do jogo
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./.tools/vpk.exe upload github --repoUrl https://github.com/${{ github.repository }} --token $env:GH_TOKEN --outputDir dist/game-release --channel win --publish --tag $env:GITHUB_REF_NAME --releaseName "Controlador FPS $env:GITHUB_REF_NAME"

      - name: Publicar canal independente do editor
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./.tools/vpk.exe upload github --repoUrl https://github.com/${{ github.repository }} --token $env:GH_TOKEN --outputDir dist/editor-release --channel editor --publish --merge --tag $env:GITHUB_REF_NAME --releaseName "Controlador FPS $env:GITHUB_REF_NAME"

      - name: Criar pastas de instalação lado a lado
        shell: pwsh
        run: |
          $gameDir = 'dist/installers/Jogo'
          $editorDir = 'dist/installers/Editor'
          New-Item -ItemType Directory -Force -Path $gameDir, $editorDir | Out-Null
          Copy-Item 'dist/game-release/ControladorFPS-win-Setup.exe' "$gameDir/ControladorFPS-win-Setup.exe"
          Copy-Item 'dist/editor-release/MapEditor-editor-Setup.exe' "$editorDir/MapEditor-editor-Setup.exe"
          @'
          @echo off
          for %%I in ("%~dp0.") do set "APP_HOME=%%~fI"
          "%APP_HOME%\ControladorFPS-win-Setup.exe" --installto "%APP_HOME%"
          '@ | Set-Content "$gameDir/Instalar-Jogo.cmd" -Encoding ascii
          @'
          @echo off
          for %%I in ("%~dp0.") do set "APP_HOME=%%~fI"
          "%APP_HOME%\MapEditor-editor-Setup.exe" --installto "%APP_HOME%"
          '@ | Set-Content "$editorDir/Instalar-Editor.cmd" -Encoding ascii
          @'
          JOGO

          Instalar-Jogo.cmd: primeira instalação nesta pasta.
          ControladorFPS-win-Setup.exe: instalador do jogo.
          Atualizar-Jogo.cmd: atualiza a instalação sem abrir o jogo.
          Feche o jogo antes de atualizar.
          '@ | Set-Content "$gameDir/LEIA-ME.txt" -Encoding utf8
          @'
          EDITOR

          Instalar-Editor.cmd: primeira instalação nesta pasta.
          MapEditor-editor-Setup.exe: instalador do editor.
          Atualizar-Editor.cmd: atualiza a instalação sem abrir o editor.
          Feche o editor antes de atualizar.
          '@ | Set-Content "$editorDir/LEIA-ME.txt" -Encoding utf8
          @'
          @echo off
          setlocal
          for %%I in ("%~dp0.") do set "APP_HOME=%%~fI"
          set "TARGET="
          if exist "%APP_HOME%current\sq.version" set "TARGET=%APP_HOME%"
          if not defined TARGET if exist "%LOCALAPPDATA%\ControladorFPS\current\sq.version" set "TARGET=%LOCALAPPDATA%\ControladorFPS"
          if not defined TARGET set "TARGET=%APP_HOME%"
          echo Atualizando o Controlador FPS sem iniciar o jogo...
          "%APP_HOME%\ControladorFPS-win-Setup.exe" --installto "%TARGET%" --silent
          if errorlevel 1 (
            echo Falha ao atualizar. Feche o jogo, se estiver aberto, e tente novamente.
            pause
            exit /b 1
          )
          echo Atualizacao concluida. O jogo nao foi aberto.
          pause
          '@ | Set-Content "$gameDir/Atualizar-Jogo.cmd" -Encoding ascii
          @'
          @echo off
          setlocal
          for %%I in ("%~dp0.") do set "APP_HOME=%%~fI"
          set "TARGET="
          if exist "%APP_HOME%current\sq.version" set "TARGET=%APP_HOME%"
          if not defined TARGET if exist "%LOCALAPPDATA%\MapEditor\current\sq.version" set "TARGET=%LOCALAPPDATA%\MapEditor"
          if not defined TARGET set "TARGET=%APP_HOME%"
          echo Atualizando o Editor sem iniciar o aplicativo...
          "%APP_HOME%\MapEditor-editor-Setup.exe" --installto "%TARGET%" --silent
          if errorlevel 1 (
            echo Falha ao atualizar. Feche o editor, se estiver aberto, e tente novamente.
            pause
            exit /b 1
          )
          echo Atualizacao concluida. O editor nao foi aberto.
          pause
          '@ | Set-Content "$editorDir/Atualizar-Editor.cmd" -Encoding ascii
          Compress-Archive -Path $gameDir -DestinationPath dist/ControladorFPS-Jogo.zip -CompressionLevel Optimal
          Compress-Archive -Path $editorDir -DestinationPath dist/MapEditor-Editor.zip -CompressionLevel Optimal

      - name: Publicar pacotes de instalação nas pastas escolhidas
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:GITHUB_REF_NAME dist/ControladorFPS-Jogo.zip dist/MapEditor-Editor.zip --repo $env:GITHUB_REPOSITORY --clobber
