name: Compilar mapa parkour com portais
on:
  push:
    branches: [feature/mapa-parkour-portais]
    paths:
      - 'src-recuperado/**'
      - '.github/workflows/build-controller.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-recuperado/**'
      - '.github/workflows/build-controller.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar C# recuperado com novas mecanicas
        run: dotnet build src-recuperado/ControladorFPS.csproj --configuration Release --nologo
      - name: Gerar executavel Windows independente
        run: dotnet publish src-recuperado/ControladorFPS.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./dist/ControladorFPS --nologo
      - name: Disponibilizar build experimental para testes
        uses: actions/upload-artifact@v4
        with:
          name: ControladorFPS-Parkour-Portais-win-x64
          path: dist/ControladorFPS/
          if-no-files-found: error
          retention-days: 14
