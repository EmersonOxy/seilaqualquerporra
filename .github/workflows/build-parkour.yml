name: Testar e publicar mapa parkour
on:
  push:
    branches: [feature/mapa-parkour-portais, feature/fisica-rampas-escadas]
    paths:
      - 'src-recuperado/**'
      - 'tools/MapEditor/**'
      - 'tests/LevelValidation/**'
      - 'tests/LevelValidation/**'
      - '.github/workflows/build-parkour.yml'
  pull_request:
    branches: [feature/coletaveis-portais, main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validar codigo
        run: dotnet build src-recuperado/ControladorFPS.csproj -c Release --nologo
      - name: Testar colisao, buracos e trajetos do mapa
        run: dotnet run --project tests/LevelValidation/LevelValidation.csproj -c Release --nologo
      - name: Compilar editor de mapas
        run: dotnet build tools/MapEditor/MapEditor.csproj -c Release --nologo
      - name: Criar executavel Windows offline
        run: dotnet publish src-recuperado/ControladorFPS.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/ControladorFPS --nologo
      - name: Publicar MapEditor.exe na mesma pasta do jogo
        run: dotnet publish tools/MapEditor/MapEditor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/ControladorFPS --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: ControladorFPS-e-Editor-Mapas-win-x64
          path: dist/ControladorFPS/
          if-no-files-found: error
          retention-days: 14
