name: Recuperar codigo C# do Controlador FPS v1.4.0
on:
  push:
    branches: [feature/coletaveis-portais]
    paths: ['.github/workflows/recuperar-fonte.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Baixar pacote oficial do proprio repositorio
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifacts
          gh release download v1.4.0 -R "$GITHUB_REPOSITORY" -p 'ControladorFPS-1.4.0-full.nupkg' -D artifacts
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('artifacts/ControladorFPS-1.4.0-full.nupkg') as z:
              z.extract('lib/app/ControladorFPS.exe', 'artifacts')
          PY
      - name: Instalar decompilador oficial
        run: dotnet tool install --tool-path "$PWD/.tools" ilspycmd --version 11.2.0.10050
      - name: Recuperar fontes a partir do bundle .NET
        shell: bash
        run: |
          set -e
          mkdir -p src-recuperado
          EXE="artifacts/lib/app/ControladorFPS.exe"
          if ! ./.tools/ilspycmd -p -o src-recuperado --bundle-entry ControladorFPS.dll "$EXE"; then
            echo "Tentando extrair os assemblies do bundle"
            mkdir -p assemblies
            ./.tools/ilspycmd -d -o assemblies "$EXE"
            find assemblies -maxdepth 3 -iname '*.dll' | head -40
            DLL="$(find assemblies -iname ControladorFPS.dll | head -n 1)"
            test -n "$DLL"
            ./.tools/ilspycmd -p -o src-recuperado "$DLL"
          fi
          find src-recuperado -type f | head -70
          test -n "$(find src-recuperado -iname '*.cs' -print -quit)"
      - name: Publicar codigo recuperado na branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-recuperado
          git diff --cached --quiet || git commit -m 'Recupera codigo C# do Controlador FPS 1.4.0 para desenvolvimento'
          git push origin HEAD:feature/coletaveis-portais
