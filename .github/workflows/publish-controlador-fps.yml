name: Publicar Controlador FPS 1.4.0
on:
  push:
    branches: [download-v1.4.0]
    paths: [.github/workflows/publish-controlador-fps.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.4.0 release-v1.4.0/ControladorFPS-win-Setup.exe release-v1.4.0/ControladorFPS-1.4.0-full.nupkg release-v1.4.0/ControladorFPS-1.4.0-delta.nupkg release-v1.4.0/releases.win.json --target "$GITHUB_SHA" --title 'Controlador FPS 1.4.0' --notes 'Céu estilizado inspirado no shader de krzmig, com sol, fases da lua, nuvens em movimento e estrelas. Pressione F8 para alternar entre dia, pôr do sol e noite.' --latest
